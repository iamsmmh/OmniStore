name: omnistore
description: >-
  OmniStore - A production-grade, repository-driven application manager
  for iOS and Android. Discover, track, download, and manage applications
  distributed through trusted repositories.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  smooth_page_indicator: ^1.1.0

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.1.0

  # Networking
  dio: ^5.4.0
  retrofit: ^4.0.1

  # Serialization
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1

  # Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.2

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Theming
  dynamic_color: ^1.7.0

  # Security
  crypto: ^3.0.3
  flutter_secure_storage: ^9.0.0

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.4
  package_info_plus: ^9.0.1
  device_info_plus: ^10.1.0
  connectivity_plus: ^6.0.1
  permission_handler: ^11.3.0
  share_plus: ^7.2.1
  collection: ^1.18.0
  equatable: ^2.0.5
  rxdart: ^0.27.7
  logging: ^1.2.0
  uuid: ^4.3.3
  timeago: ^3.6.1
  percent_indicator: ^4.2.3

  # Background
  workmanager: ^0.5.2
  flutter_cache_manager: ^3.3.1

  # Android/iOS specific
  android_package_manager: ^0.7.1
  open_filex: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  isar_generator: ^3.1.0+1
  retrofit_generator: ^8.0.6
  mocktail: ^1.0.3
  bloc_test: ^9.1.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
