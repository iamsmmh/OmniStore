name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: Flutter tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.3'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test --reporter expanded

  codegen-and-analyze:
    name: Codegen + static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Informational for now: audit finding F-23 tracks the generated-code
    # policy. Test failures in the `tests` job are the gating signal.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.3'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze
